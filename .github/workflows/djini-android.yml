# ─────────────────────────────────────────────────────────────────────────────
# djini mobile security scan — ANDROID (GitHub Actions demo)
#
# Builds the bundled Android lab (sample-app-android/), scans it with djini, attaches the
# report + SARIF to the run, and fails the build when findings exceed your
# threshold. See djini-ios.yml for the iOS equivalent.
#
# Setup (one-time):
#   1. Create a djini API key:  djini → Settings → API key.
#   2. Repo → Settings → Secrets and variables → Actions:
#        DJINI_API_KEY   (Secret)   your djini API key (sk-...)
#        DJINI_BASE_URL  (Variable) your djini URL, e.g. https://app.djini.ai
#   3. For your own app, point the "Build APK" step at your build.
# ─────────────────────────────────────────────────────────────────────────────
name: djini security scan (Android)

# Manual trigger only — run it from the Actions tab ("Run workflow"). Uncomment
# push/pull_request below to gate every PR automatically.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan type"
        type: choice
        default: quick-source
        options:
          - quick-source   # fast AI source scan (MASVS/MASWE) on the source tree
          - full           # full binary scan (decompile + dynamic) of the built app
      fail_on:
        description: "Fail the build at/above this severity"
        type: choice
        default: high
        options: [critical, high, medium, low, none]
      deep_scan:
        description: "Also run the deep scan (only applies to 'full')"
        type: boolean
        default: false
      create_issues:
        description: "Open a GitHub issue per finding (fallback when Code Scanning is unavailable)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: djini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Build & scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write   # upload SARIF to GitHub Code Scanning (needs GHAS on private repos)
      issues: write            # optional: open issues from findings (create_issues)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Provide the APK ───────────────────────────────────────────────────
      # Demo: use the committed prebuilt APK so the pipeline runs fast without a
      # Gradle toolchain (mirrors the iOS workflow). To build from source
      # instead, delete this step and uncomment the Gradle block below.
      - name: Provide APK
        id: build
        run: |
          apk="sample-app-android/mhl-lab-tokenbleed.apk"
          test -f "$apk" || { echo "::error::$apk not found"; exit 1; }
          echo "artifact=$apk" >> "$GITHUB_OUTPUT"

      # ── Build from source (alternative to the prebuilt APK above) ──────────
      # Uncomment to build sample-app-android/ with Gradle and scan the fresh APK. For
      # your own project, point these steps at your build — the only contract is
      # that `steps.build.outputs.artifact` holds the path to a single .apk/.aab.
      #
      # - name: Set up JDK
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: "17"
      #
      # - name: Set up Gradle
      #   uses: gradle/actions/setup-gradle@v4
      #
      # - name: Build APK
      #   id: build
      #   working-directory: sample-app-android
      #   run: |
      #     chmod +x ./gradlew
      #     ./gradlew --no-daemon assembleRelease
      #     apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
      #     echo "artifact=sample-app-android/$apk" >> "$GITHUB_OUTPUT"

      - name: Install scan dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # ── Scan with djini ───────────────────────────────────────────────────
      - name: Run djini scan
        id: djini
        env:
          API_KEY: ${{ secrets.DJINI_API_KEY }}
          # The djini URL is not sensitive — a repo variable keeps it readable in
          # logs (a secret would be masked as ***). Only the API key is a secret.
          BASE_URL: ${{ vars.DJINI_BASE_URL }}
        run: |
          chmod +x .github/scripts/djini-scan.sh
          # scan_type: quick-source (default) passes the source tree for the fast
          # AI source scan; 'full' omits it and runs the binary scan.
          .github/scripts/djini-scan.sh \
            --file "${{ steps.build.outputs.artifact }}" \
            --fail-on "${{ inputs.fail_on || 'high' }}" \
            ${{ (inputs.scan_type != 'full') && '--source sample-app-android' || '' }} \
            ${{ (inputs.deep_scan && '--deep-scan') || '' }} \
            --output "djini-report.pdf" \
            --findings "djini-findings.json" \
            --sarif "djini-results.sarif"

      # ── Surface findings as PR annotations (GitHub Code Scanning) ─────────
      # `if: always()` so results still upload when the gate step fails the build.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('djini-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: djini-results.sarif
          category: djini

      # ── Optional: open a GitHub issue per finding (no GHAS needed) ────────
      - name: Create issues from findings
        if: always() && inputs.create_issues && hashFiles('djini-results.sarif') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAIL_ON: ${{ inputs.fail_on || 'high' }}
        run: |
          chmod +x .github/scripts/djini-issues.sh
          .github/scripts/djini-issues.sh djini-results.sarif

      # ── Keep the evidence ─────────────────────────────────────────────────
      - name: Upload djini report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djini-report
          path: |
            djini-report.pdf
            djini-findings.json
            djini-results.sarif
          if-no-files-found: warn
