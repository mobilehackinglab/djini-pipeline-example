# ─────────────────────────────────────────────────────────────────────────────
# djini mobile security scan — GitHub Actions demo
#
# Copy this file into YOUR repository at .github/workflows/djini-security-scan.yml
# and copy scripts/djini-scan.sh into .github/scripts/ (or vendor it however you
# like). It builds your mobile app, scans it with djini, attaches the report to
# the run, and fails the build when findings exceed your threshold.
#
# Setup (one-time):
#   1. Create a djini API key:  djini → Settings → API key.
#   2. Add repository secrets (Settings → Secrets and variables → Actions):
#        DJINI_API_KEY   your djini API key (sk-...)
#        DJINI_BASE_URL  your djini URL, e.g. https://app.djini.ai
#   3. Point the "Build" step at your real build (or upload a prebuilt binary).
# ─────────────────────────────────────────────────────────────────────────────
name: djini security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Fail the build at/above this severity"
        type: choice
        default: high
        options: [critical, high, medium, low, none]
      deep_scan:
        description: "Also run the deep scan (slower, deeper)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: djini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Build & scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build your app ────────────────────────────────────────────────────
      # Replace this with your real build. The goal is to produce a single
      # artifact (.apk / .aab / .ipa) and expose its path as an output.
      #
      # Android (Gradle) example:
      #   - uses: actions/setup-java@v4
      #     with: { distribution: temurin, java-version: "17" }
      #   - run: ./gradlew assembleRelease
      #   - id: build
      #     run: echo "artifact=$(ls app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_OUTPUT"
      #
      # iOS: archive & export a .ipa on a `macos-latest` runner, then upload it
      # as an artifact and download it in an ubuntu job that runs the scan.
      - name: Build (demo placeholder)
        id: build
        run: |
          # Demo only: fail loudly until you wire up your real build above.
          if [ -z "${DEMO_ARTIFACT:-}" ]; then
            echo "::error::Replace the 'Build' step with your app's build and set steps.build.outputs.artifact"
            exit 1
          fi
          echo "artifact=$DEMO_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Install scan dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # ── Scan with djini ───────────────────────────────────────────────────
      - name: Run djini scan
        id: djini
        env:
          API_KEY: ${{ secrets.DJINI_API_KEY }}
          BASE_URL: ${{ secrets.DJINI_BASE_URL }}
        run: |
          chmod +x .github/scripts/djini-scan.sh
          .github/scripts/djini-scan.sh \
            --file "${{ steps.build.outputs.artifact }}" \
            --fail-on "${{ inputs.fail_on || 'high' }}" \
            ${{ (inputs.deep_scan && '--deep-scan') || '' }} \
            --output "djini-report.pdf" \
            --findings "djini-findings.json" \
            --sarif "djini-results.sarif"

      # ── Surface findings as PR annotations (GitHub Code Scanning) ─────────
      # `if: always()` so results still upload when the gate step fails the build.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('djini-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: djini-results.sarif
          category: djini

      # ── Keep the evidence ─────────────────────────────────────────────────
      - name: Upload djini report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djini-report
          path: |
            djini-report.pdf
            djini-findings.json
            djini-results.sarif
          if-no-files-found: warn
